<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e13">
<title>Scanner</title>
<link rel="icon" href="data:,">
<script>
// OPTIONAL: your Cloudflare Worker URL (see cloudflare-worker.js), e.g. 'https://scanner.yourname.workers.dev'
// With it, prices and candles are downloaded in a compact format (far less data).
window.SCANNER_PROXY='';
window.__pre=fetch(window.SCANNER_PROXY?window.SCANNER_PROXY+'/lite/prices':'https://fapi.binance.com/fapi/v1/ticker/price',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
</script>
<link rel="preconnect" href="https://fapi.binance.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<main class="app-shell">
  <div class="table-wrap">
    <table id="scannerTable">
      <thead>
        <tr>
          <th data-sort="symbol">PAIR</th>
          <th data-sort="price">PRICE</th>
          <th data-sort="pctDay" class="metric-head candle-head"><span id="candleHead">CANDLE (4H)</span></th>
          <th data-sort="volume"><span id="volHead">VOL (4H)</span></th>
          <th data-sort="s4" class="metric-head smma-head h4-head"><span id="smmaHead">SMMA7 (4H)</span></th>
          <th data-sort="rsi" class="metric-head rsi-head h4-head"><span id="rsiHead">RSI (4H)</span></th>
          <th data-sort="dmi" class="metric-head dmi-head h4-head"><span id="dmiHead">DMI (4H)</span></th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="7" class="loading">Loading Binance USDT perpetuals…</td></tr>
      </tbody>
    </table>
  </div>
  <div class="status-bar">
    <span id="statusDot" class="status-dot"></span>
    <span id="statusText">Connecting to Binance…</span>
    <span class="status-spacer"></span>
    <label class="tf-label" for="timeframeSelect">TIMEFRAME</label>
    <select id="timeframeSelect" class="timeframe-select" aria-label="Select indicator timeframe">
      <option value="15m">15 min</option><option value="1h">1 hour</option><option value="4h">4 hours</option><option value="1d">Daily</option><option value="1w">Weekly</option><option value="1M">Monthly</option>
    </select>
    <input id="searchInput" class="search-input" type="search" placeholder="Search coin…" autocomplete="off" spellcheck="false">
    <button id="longBtn" class="filter-btn long" type="button" aria-pressed="false" title="Show only symbols where SMMA 7, RSI, and DMI are all bullish on the selected timeframe">LONG</button>
    <button id="shortBtn" class="filter-btn short" type="button" aria-pressed="false" title="Show only symbols where SMMA 7, RSI, and DMI are all bearish on the selected timeframe">SHORT</button>
  </div>
</main>
</body>
</html>
